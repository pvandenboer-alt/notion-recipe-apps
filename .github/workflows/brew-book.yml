name: Build Brew book

# Builds the Android app and publishes it as the "brew-book" release, replacing the previous APK.
on:
  push:
    branches: [main]
    paths: ['brew-book/**', '.github/workflows/brew-book.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: brew-book

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Permissions for brew-day alarms and the camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.CAMERA" />#' "$M"
          grep -q USE_EXACT_ALARM "$M"

      - name: Version number
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"

      - name: App icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#191919' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#191919'

      - name: Sync web app
        run: npx cap sync android

      # Updates only install over an earlier version signed with the same key. Store your key as the
      # ANDROID_KEYSTORE_BASE64 secret (see the README); without it each build gets a throwaway key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key, so this APK won't install over earlier builds."
            keytool -genkeypair -v -storetype pkcs12 -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Sign with that key
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE

      - name: Build APK
        working-directory: brew-book/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BrewBook.apk
          NOTES="Version $VERSION. On your Android phone, download BrewBook.apk below and open it to install or update. Setup instructions: https://github.com/${{ github.repository }}#readme"
          git tag -f brew-book && git push -f origin refs/tags/brew-book
          if gh release view brew-book >/dev/null 2>&1; then
            gh release upload brew-book BrewBook.apk --clobber
            gh release edit brew-book --title "Brew book $VERSION" --notes "$NOTES"
          else
            gh release create brew-book BrewBook.apk --title "Brew book $VERSION" --notes "$NOTES"
          fi
